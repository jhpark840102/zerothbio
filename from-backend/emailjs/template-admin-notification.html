<!--
EmailJS template 1: 관리자 알림 (Admin notification)
Dashboard → Email Templates → Create New Template → "Code editor"에 이 파일 내용을 붙여넣기

[Settings 탭]
  To Email   : zerothbio@gmail.com
  From Name  : ZerothBIO Website
  From Email : (기본값 사용 — 연결한 Gmail 서비스 주소)
  Reply To   : {{reply_to}}
  Subject    : [ZerothBIO 홈페이지 문의] {{topic}} — {{name}} ({{org}})
-->
<div style="font-family:Pretendard,'Apple SD Gothic Neo','Malgun Gothic',Arial,sans-serif;color:#212121;max-width:640px;margin:0 auto">
  <div style="background:#09223E;color:#ffffff;padding:18px 24px;font-size:15px;font-weight:600">
    ZerothBIO · 홈페이지 문의 접수 <span style="float:right;font-weight:400;color:#9FD9E3">{{lang}}</span>
  </div>
  <table style="width:100%;border-collapse:collapse;font-size:14px;margin:0">
    <tr><td style="padding:10px 24px;width:110px;color:#5C626B;border-bottom:1px solid #E3E6EA">접수 시각</td><td style="padding:10px 24px;border-bottom:1px solid #E3E6EA">{{submitted_at}}</td></tr>
    <tr><td style="padding:10px 24px;color:#5C626B;border-bottom:1px solid #E3E6EA">문의 유형</td><td style="padding:10px 24px;border-bottom:1px solid #E3E6EA"><b>{{topic}}</b></td></tr>
    <tr><td style="padding:10px 24px;color:#5C626B;border-bottom:1px solid #E3E6EA">이름</td><td style="padding:10px 24px;border-bottom:1px solid #E3E6EA">{{name}}</td></tr>
    <tr><td style="padding:10px 24px;color:#5C626B;border-bottom:1px solid #E3E6EA">소속</td><td style="padding:10px 24px;border-bottom:1px solid #E3E6EA">{{org}}</td></tr>
    <tr><td style="padding:10px 24px;color:#5C626B;border-bottom:1px solid #E3E6EA">이메일</td><td style="padding:10px 24px;border-bottom:1px solid #E3E6EA"><a href="mailto:{{email}}" style="color:#128291">{{email}}</a></td></tr>
  </table>
  <div style="padding:18px 24px">
    <div style="font-size:12px;color:#5C626B;margin-bottom:6px">문의 내용</div>
    <div style="white-space:pre-wrap;font-size:15px;line-height:1.6;background:#F3F3F3;border-radius:6px;padding:14px 16px">{{message}}</div>
  </div>
  <div style="padding:0 24px 20px;font-size:12px;color:#8B9098">
    페이지: {{page}} · 개인정보 수집·이용 동의: {{consent}}<br>
    이 메일에 회신하면 문의자에게 바로 답장됩니다.
  </div>
</div>
